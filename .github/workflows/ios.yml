name: iOS
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test
      - name: iOS simulator build
        run: xcodebuild -project PocketLedger.xcodeproj -scheme PocketLedger -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
