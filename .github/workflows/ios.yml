name: iOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Core tests
        run: swift test
      - name: iOS simulator build
        if: ${{ !cancelled() }}
        run: xcodebuild -quiet -project PocketLedger.xcodeproj -scheme PocketLedger -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Simulator launch smoke test
        run: python3 scripts/smoke-ios.py
      - name: Fictional UI board
        run: swift scripts/render-demo-board.swift
